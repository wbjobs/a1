<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC声纹识别通话系统</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app">
        <div id="login-view" class="view active">
            <div class="card">
                <h1>🎙️ WebRTC声纹识别通话</h1>
                <p class="subtitle">实时声纹识别 · 多方音视频通话</p>
                
                <div class="tabs">
                    <button class="tab-btn active" data-tab="join">加入通话</button>
                    <button class="tab-btn" data-tab="register">注册声纹</button>
                </div>

                <div id="join-tab" class="tab-content active">
                    <div class="form-group">
                        <label>房间号</label>
                        <input type="text" id="join-room-id" placeholder="请输入房间号">
                    </div>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="join-user-name" placeholder="请输入您的用户名">
                    </div>
                    <div class="form-group">
                        <label>用户ID（可选，已注册用户填写）</label>
                        <input type="text" id="join-user-id" placeholder="已注册用户的ID">
                    </div>
                    <button id="join-btn" class="btn primary">进入房间</button>
                </div>

                <div id="register-tab" class="tab-content">
                    <div class="form-group">
                        <label>房间号</label>
                        <input type="text" id="reg-room-id" placeholder="请输入房间号">
                    </div>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="reg-user-name" placeholder="请输入您的用户名">
                    </div>
                    <div class="form-group">
                        <label>邮箱（可选）</label>
                        <input type="email" id="reg-email" placeholder="your@email.com">
                    </div>

                    <div class="audio-samples">
                        <h3>录制3段5秒声纹样本</h3>
                        <div class="sample-list">
                            <div class="sample-item" data-sample="1">
                                <span class="sample-number">1</span>
                                <span class="sample-status">未录制</span>
                                <button class="btn small record-btn" data-sample="1">录制</button>
                                <audio class="sample-audio" controls style="display:none;"></audio>
                            </div>
                            <div class="sample-item" data-sample="2">
                                <span class="sample-number">2</span>
                                <span class="sample-status">未录制</span>
                                <button class="btn small record-btn" data-sample="2">录制</button>
                                <audio class="sample-audio" controls style="display:none;"></audio>
                            </div>
                            <div class="sample-item" data-sample="3">
                                <span class="sample-number">3</span>
                                <span class="sample-status">未录制</span>
                                <button class="btn small record-btn" data-sample="3">录制</button>
                                <audio class="sample-audio" controls style="display:none;"></audio>
                            </div>
                        </div>
                        <div id="recording-timer" class="timer" style="display:none;">
                            <span id="timer-count">5</span>秒
                        </div>
                    </div>

                    <button id="register-btn" class="btn primary" disabled>注册声纹</button>
                    <div id="register-result" class="result-message"></div>
                </div>
            </div>
        </div>

        <div id="call-view" class="view">
            <header class="call-header">
                <div class="room-info">
                    <span class="room-label">房间:</span>
                    <span id="current-room">-</span>
                </div>
                <div class="user-info">
                    <span class="user-label">用户:</span>
                    <span id="current-user">-</span>
                </div>
                <button id="leave-btn" class="btn danger">离开房间</button>
            </header>

            <div class="call-container">
                <div class="videos-section">
                    <div id="videos-container" class="videos-grid">
                        <div class="video-wrapper">
                            <video id="local-video" autoplay muted playsinline></video>
                            <div class="video-label">你 (本地)</div>
                        </div>
                    </div>
                </div>

                <div class="analysis-section">
                    <div class="panel">
                        <h3>🎵 声纹波形图</h3>
                        <canvas id="waveform-canvas" class="visualization-canvas"></canvas>
                    </div>

                    <div class="panel">
                        <h3>🔥 相似度热力图</h3>
                        <canvas id="heatmap-canvas" class="visualization-canvas"></canvas>
                        <div id="heatmap-legend" class="legend">
                            <span>低</span>
                            <div class="gradient-bar"></div>
                            <span>高</span>
                        </div>
                    </div>

                    <div class="panel">
                        <h3>🗣️ 当前说话人</h3>
                        <div id="current-speaker" class="speaker-display">
                            <div class="speaker-name">等待识别...</div>
                            <div class="speaker-similarity">相似度: --</div>
                        </div>
                    </div>

                    <div class="panel">
                        <h3>📊 识别历史</h3>
                        <div id="recognition-history" class="history-list"></div>
                    </div>

                    <div class="panel">
                        <h3>👥 在线用户</h3>
                        <div id="users-list" class="users-list"></div>
                    </div>
                </div>
            </div>

            <div class="call-controls">
                <button id="toggle-audio" class="btn control-btn active">
                    <span class="icon">🎤</span> 麦克风
                </button>
                <button id="toggle-video" class="btn control-btn active">
                    <span class="icon">📷</span> 摄像头
                </button>
                <button id="toggle-analysis" class="btn control-btn active">
                    <span class="icon">🔍</span> 声纹分析
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
